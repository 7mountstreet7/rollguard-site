<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the list — RollGuard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#152420;--ink-soft:#3d514c;--paper:#EEF2F0;--teal:#0F6E56;--teal-deep:#0A4E3E;--mint:#DCEEE7;--line:#D8DFDC;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--teal-deep);}
  nav{max-width:720px;margin:0 auto;padding:28px 24px 0;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:var(--ink);text-decoration:none;}
  .brand span{color:var(--teal);}
  .wrap{max-width:560px;margin:0 auto;padding:80px 24px 96px;text-align:center;}
  .mark{font-size:44px;margin-bottom:18px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;letter-spacing:-0.02em;margin:0 0 14px;}
  p{color:var(--ink-soft);font-size:16px;margin:0 0 14px;}
  .back{display:inline-block;margin-top:24px;font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<nav><a class="brand" href="/">Roll<span>Guard</span></a></nav>
<div class="wrap">
  <div class="mark">✓</div>
  <h1>You're on the list.</h1>
  <p>Thanks — you'll hear from us once, the day RollGuard launches. In the meantime, the <a href="/#guides">guides</a> are worth a read.</p>
  <a class="back" href="/">← Back to rollguard.app</a>
</div>
</body>
</html>
