<style>
  :root{
    --ink:#152420;
    --ink-soft:#3d514c;
    --paper:#EEF2F0;
    --teal:#0F6E56;
    --teal-deep:#0A4E3E;
    --line:#D8DFDC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px;}
  .rollie{width:180px;max-width:60vw;margin:0 auto 28px;display:block;}
  h1{font-family:"Space Grotesk","Inter",system-ui,sans-serif;font-weight:700;font-size:clamp(26px,4.4vw,36px);letter-spacing:-0.02em;line-height:1.2;margin:0 0 14px;max-width:22ch;}
  p{color:var(--ink-soft);font-size:16px;margin:0 0 28px;max-width:44ch;}
  .btn{
    display:inline-block;font-weight:600;font-size:15px;
    padding:13px 24px;border-radius:10px;text-decoration:none;
    background:var(--teal);color:#fff;
  }
  .btn:hover{background:var(--teal-deep);}
  .mail{display:inline-block;margin-top:18px;font-size:14.5px;color:var(--teal);text-decoration:none;}
  .mail:hover{color:var(--teal-deep);text-decoration:underline;}
  footer{padding:32px 24px 40px;border-top:1px solid var(--line);text-align:center;font-size:13.5px;color:var(--ink-soft);}
  footer a{color:var(--teal-deep);}
</style>
</head>

<main>
  <img class="rollie" src="/images/rollie-searching.png" alt="Rollie, the RollGuard mascot, searching with a magnifying glass" onerror="this.style.display='none'">
